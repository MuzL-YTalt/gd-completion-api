name: Test Geometry Dash API Access

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GD_ACCOUNT_ID: "18986696"
  PHOBOS_LEVEL_ID: "19759411"

jobs:
  test-gdbrowser:
    runs-on: ubuntu-latest
    steps:
      - name: Test GDBrowser level endpoint
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS "https://gdbrowser.com/api/level/128")
          printf '%s' "$response" | jq '{id, name, author, creator}'
          printf '%s' "$response" | jq -e '.id and .name' >/dev/null
          echo "GDBrowser level API works."

      - name: Resolve user's Geometry Dash profile
        shell: bash
        run: |
          set -euo pipefail
          profile=$(curl -fsS "https://gdbrowser.com/api/profile/$GD_ACCOUNT_ID")
          echo "Profile returned for account ID $GD_ACCOUNT_ID:"
          printf '%s' "$profile" | jq '{username, playerID, accountID, commentHistory}'
          printf '%s' "$profile" | jq -e --arg id "$GD_ACCOUNT_ID" '(.accountID | tostring) == $id' >/dev/null
          echo "User profile resolved successfully."

      - name: Fetch all user comment history
        shell: bash
        run: |
          set -euo pipefail
          profile=$(curl -fsS "https://gdbrowser.com/api/profile/$GD_ACCOUNT_ID")
          player_id=$(printf '%s' "$profile" | jq -r '.playerID')
          username=$(printf '%s' "$profile" | jq -r '.username')
          echo "Resolved $username: player ID $player_id, account ID $GD_ACCOUNT_ID"

          page=0
          total=0
          while [ "$page" -lt 100 ]; do
            comments=$(curl -fsS "https://gdbrowser.com/api/comments/$player_id?type=commentHistory&page=$page&count=100")
            count=$(printf '%s' "$comments" | jq 'length')
            echo "Comment-history page $page: $count comments"
            total=$((total + count))

            if [ "$count" -eq 0 ] || [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
          done

          echo "TOTAL USER COMMENTS FOUND: $total"
          test "$total" -ge 0

      - name: Test user's profile comments
        shell: bash
        run: |
          set -euo pipefail
          comments=$(curl -fsS "https://gdbrowser.com/api/comments/$GD_ACCOUNT_ID?type=profile&count=100")
          echo "Profile comments for account ID $GD_ACCOUNT_ID:"
          printf '%s' "$comments" | jq 'if length > 0 then .[0] | {ID, content, username, playerID, accountID, date} else {} end'
          printf '%s' "$comments" | jq -e 'type == "array"' >/dev/null
          echo "User profile comments endpoint works."

      - name: Test Phobos completion comment lookup
        shell: bash
        run: |
          set -euo pipefail
          comments=$(curl -fsS "https://gdbrowser.com/api/comments/$PHOBOS_LEVEL_ID?count=100")
          echo "Searching Phobos ($PHOBOS_LEVEL_ID) for account ID $GD_ACCOUNT_ID..."
          printf '%s' "$comments" | jq --arg account "$GD_ACCOUNT_ID" '[.[] | select((.accountID | tostring) == $account)] | .[] | {ID, content, username, playerID, accountID, date, levelID}'
          if printf '%s' "$comments" | jq -e --arg account "$GD_ACCOUNT_ID" 'any(.[]; (.accountID | tostring) == $account)' >/dev/null; then
            echo "Found a comment from the user's account on Phobos."
          else
            echo "No comment from the user's account was found on the first 100 Phobos comments."
          fi

      - name: Run lookup module against Phobos
        shell: bash
        run: |
          set -euo pipefail
          cat > test-lookup.js <<'EOF'
          const { lookupCompletionDate } = require('./src/lookup');

          (async () => {
            const result = await lookupCompletionDate({
              levelId: process.env.PHOBOS_LEVEL_ID,
              user: { accountId: process.env.GD_ACCOUNT_ID }
            });
            console.log(JSON.stringify(result, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          node test-lookup.js

      - name: Test GDHistory comment date service
        shell: bash
        run: |
          set -euo pipefail
          comment_id=431737815
          date_response=$(curl -fsS "https://history.geometrydash.eu/api/v1/date/comment/128/$comment_id/level/")
          echo "GDHistory response: $date_response"
          printf '%s' "$date_response" | jq -e 'type == "object"' >/dev/null
          echo "GDHistory comment-date endpoint is reachable."
