name: Test Geometry Dash API Access

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-gdbrowser:
    runs-on: ubuntu-latest
    steps:
      - name: Test GDBrowser level endpoint
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing GDBrowser from a GitHub-hosted runner..."

          response=$(curl -fsS \
            "https://gdbrowser.com/api/level/128")

          if ! printf '%s' "$response" | grep -q '"id"'; then
            echo "GDBrowser did not return the expected JSON level data."
            exit 1
          fi

          if ! printf '%s' "$response" | grep -q '"name"'; then
            echo "GDBrowser response is missing the level name."
            exit 1
          fi

          echo "GDBrowser level API works."

      - name: Test GDBrowser level comments
        shell: bash
        run: |
          set -euo pipefail

          comments=$(curl -fsS \
            "https://gdbrowser.com/api/comments/128")

          echo "First level comment:"
          printf '%s' "$comments" | jq '.[0] | {ID, content, username, playerID, accountID, date, levelID}'

          comment_id=$(printf '%s' "$comments" | jq -r '.[0].ID // empty')

          if [ -z "$comment_id" ]; then
            echo "No comment ID was found."
            exit 1
          fi

          echo "GDBrowser level comments work."

      - name: Test GDBrowser account comments
        shell: bash
        run: |
          set -euo pipefail

          # Uino's player ID from the level-comment response above.
          account_comments=$(curl -fsS \
            "https://gdbrowser.com/api/comments/306345839?type=profile")

          echo "First account/profile comment:"
          printf '%s' "$account_comments" | jq '.[0] // {} | {ID, content, username, playerID, accountID, date}'

          if ! printf '%s' "$account_comments" | jq -e 'type == "array"' >/dev/null; then
            echo "GDBrowser did not return an account-comment array."
            exit 1
          fi

          echo "GDBrowser account comments work."

      - name: Test GDHistory date estimation
        shell: bash
        run: |
          set -euo pipefail

          # Use an older page of level comments so the historical estimator has
          # a better chance of having data for the comment.
          old_comments=$(curl -fsS \
            "https://gdbrowser.com/api/comments/128?page=4426")

          old_comment_id=$(printf '%s' "$old_comments" | jq -r '.[0].ID // empty')

          if [ -z "$old_comment_id" ]; then
            echo "No older comment was returned by GDBrowser."
            exit 1
          fi

          echo "Testing GDHistory for old comment $old_comment_id..."

          date_response=$(curl -fsS \
            "https://history.geometrydash.eu/api/v1/date/comment/128/$old_comment_id/level/")

          echo "GDHistory response: $date_response"

          # GDHistory is an estimator and its database is incomplete, so an
          # empty object is a valid service response; it simply means that no
          # estimate is available for this particular comment yet.
          if ! printf '%s' "$date_response" | jq -e 'type == "object"' >/dev/null; then
            echo "GDHistory returned an unexpected response."
            exit 1
          fi

          echo "GDHistory date service is reachable."
