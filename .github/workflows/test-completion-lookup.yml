name: Test Completion Lookup

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-completion-lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test account comment lookup by level ID
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { getProfile, findUserCommentByLevelId } = require('./src/lookup');

          (async () => {
            const accountId = '18986696';
            const levelId = '19759411';

            const profile = await getProfile(accountId);
            const comment = await findUserCommentByLevelId(accountId, levelId);

            if (!comment) {
              throw new Error(`No comment found for level ${levelId}.`);
            }

            if (String(comment.levelID) !== levelId) {
              throw new Error(`Returned comment is attached to level ${comment.levelID}, not ${levelId}.`);
            }

            console.log(JSON.stringify({
              accountID: profile.accountID,
              username: profile.username,
              playerID: profile.playerID,
              levelId,
              commentId: comment.ID,
              relativeDate: comment.date,
              content: comment.content
            }, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
