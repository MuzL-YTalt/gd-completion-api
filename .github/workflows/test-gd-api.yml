name: Test Geometry Dash API

on:
  push:
    paths:
      - '.github/workflows/test-gd-api.yml'
  workflow_dispatch:
    inputs:
      level_id:
        description: 'Geometry Dash level ID to test (leave blank to test the Daily Level endpoint)'
        required: false
        type: string
        default: ''

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Test Boomlings connection
        shell: bash
        env:
          LEVEL_ID: ${{ inputs.level_id }}
        run: |
          set -euo pipefail

          echo 'Testing access to the Geometry Dash server from a GitHub-hosted runner...'
          echo

          if [ -z "$LEVEL_ID" ]; then
            echo 'Endpoint: getGJDailyLevel.php'
            RESPONSE=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
              -X POST \
              'https://www.boomlings.com/database/getGJDailyLevel.php' \
              --data-urlencode 'secret=Wmfd2893gb7' \
              --data-urlencode 'gameVersion=22' \
              --data-urlencode 'binaryVersion=47')
          else
            echo 'Endpoint: downloadGJLevel22.php'
            echo "Level ID: $LEVEL_ID"
            RESPONSE=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
              -X POST \
              'https://www.boomlings.com/database/downloadGJLevel22.php' \
              --data-urlencode 'secret=Wmfd2893gb7' \
              --data-urlencode 'gameVersion=22' \
              --data-urlencode 'binaryVersion=47' \
              --data-urlencode "levelID=$LEVEL_ID")
          fi

          echo
          echo '--- Boomlings response ---'
          echo "$RESPONSE"
          echo '--- End response ---'

          if echo "$RESPONSE" | grep -q 'HTTP_STATUS:200'; then
            echo 'GitHub runner successfully reached Boomlings.'
          else
            echo 'GitHub runner could not successfully reach the Geometry Dash API.'
            exit 1
          fi
