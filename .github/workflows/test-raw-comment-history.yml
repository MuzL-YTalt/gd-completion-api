name: Test Raw GD Comment History

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-raw-comment-history:
    runs-on: ubuntu-latest
    steps:
      - name: Query RobTop comment history
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H 'User-Agent: Geometry Dash' \
            --data 'userID=142174806' \
            --data 'page=0' \
            --data 'count=100' \
            --data 'mode=0' \
            --data 'gameVersion=22' \
            --data 'binaryVersion=47' \
            --data 'secret=Wmfd2893gb7' \
            'https://www.boomlings.com/database/getGJCommentHistory.php' \
            | tee raw-comment-history.txt

      - name: Inspect response
        shell: bash
        run: |
          set -euo pipefail
          echo "Response size: $(wc -c < raw-comment-history.txt) bytes"
          echo "Response:"
          cat raw-comment-history.txt
