name: Test User Comment History

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-user-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch every level comment for account 18986696
        shell: bash
        run: |
          set -euo pipefail
          node > user-comments.json <<'NODE'
          const { getProfile, getAllUserComments } = require('./src/lookup');

          (async () => {
            const accountId = '18986696';
            const profile = await getProfile(accountId);
            const comments = await getAllUserComments(accountId);

            const output = {
              accountID: profile.accountID,
              username: profile.username,
              playerID: profile.playerID,
              commentHistory: profile.commentHistory,
              levelCommentCount: comments.length,
              comments: comments.map(comment => ({
                commentId: comment.ID,
                levelId: comment.levelID,
                date: comment.date,
                content: comment.content
              }))
            };

            process.stdout.write(JSON.stringify(output, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          jq -e '.accountID == "18986696" and .levelCommentCount >= 0 and (.comments | type == "array")' user-comments.json >/dev/null
          echo "Exported $(jq '.levelCommentCount' user-comments.json) level comments."

      - name: Upload complete comment history
        uses: actions/upload-artifact@v4
        with:
          name: geometry-dash-user-comments
          path: user-comments.json
          if-no-files-found: error
